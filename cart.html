<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سلة المشتريات - 5AMSA STORE</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1 style="text-align:center;margin:30px;">
        🛒 سلة المشتريات
    </h1>

    <!-- هنا هيتعرض المنتجات وزرار الـ ❌ أوتوماتيك -->
    <div id="cart-list" style="max-width:800px;margin:auto;padding:20px; background: #fff; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);"></div>

    <div style="max-width:800px;margin:auto;padding:20px;">
        <h2 style="margin-top:20px;color:#6d0f2d; text-align: center;">
            الإجمالي: <span id="cart-total">0</span> جنيه
        </h2>
    </div>

    <div style="max-width:800px;margin:auto;padding:20px;">
        <h3>بيانات الطلب</h3>
        
        <!-- تم تعديل الـ ID عشان يقرأ من الدالة sendWhatsApp الموحدة -->
        <input id="name" type="text" placeholder="الاسم بالكامل" style="width:100%;padding:12px;margin:10px 0; border: 1px solid #ccc; border-radius: 5px;">
        <input id="phone" type="text" placeholder="رقم الهاتف" style="width:100%;padding:12px;margin:10px 0; border: 1px solid #ccc; border-radius: 5px;">
        <input id="address" type="text" placeholder="المحافظة والعنوان بالتفصيل" style="width:100%;padding:12px;margin:10px 0; border: 1px solid #ccc; border-radius: 5px;">

        <!-- الزرار بيشغل الدالة الموحدة اللي في ملف cart.js -->
        <button onclick="sendWhatsApp()" style="width:100%;padding:15px;background:#25D366;color:white;border:none;border-radius:10px;font-size:18px;cursor:pointer;font-weight:bold;">
            إرسال الطلب عبر واتساب
        </button>
    </div>

    <!-- استدعاء ملف الجافا سكريبت الخارجي الموحد -->
    <script src="cart.js"></script>

</body>
</html>
