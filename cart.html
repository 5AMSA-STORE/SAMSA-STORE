<style>

.cart-container{
max-width:900px;
margin:40px auto;
padding:25px;
background:#fff;
border-radius:15px;
box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.cart-title{
text-align:center;
margin-bottom:25px;
color:#4a1521;
}

.cart-item{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px;
margin-bottom:10px;
border-bottom:1px solid #eee;
}

.cart-item h4{
margin:0;
}

.remove-btn{
background:#ff3b5c;
color:white;
border:none;
padding:8px 15px;
border-radius:8px;
cursor:pointer;
font-weight:bold;
}

.remove-btn:hover{
opacity:.9;
}

.cart-total{
font-size:22px;
font-weight:bold;
text-align:center;
margin-top:20px;
color:#4a1521;
}

.customer-data{
margin-top:25px;
display:flex;
flex-direction:column;
gap:12px;
}

.customer-data input{
padding:12px;
border:1px solid #ddd;
border-radius:10px;
font-size:15px;
}

.whatsapp-btn{
width:100%;
padding:15px;
margin-top:20px;
background:#25D366;
color:white;
border:none;
border-radius:10px;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

.whatsapp-btn:hover{
opacity:.9;
}

.empty-cart{
text-align:center;
padding:40px;
font-size:20px;
color:#999;
}

</style>
